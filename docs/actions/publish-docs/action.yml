name: Publish docs
description: >
  Publish a service's, library's or application's spec (OpenAPI, or a GraphQL
  SDL file / introspection of a local endpoint) to the
  Agrippa docs platform (node-service-docs, docs-platform-0) with
  PUT /sources/:key/versions/:version, with the service's event manifest
  (docs/events.json) when it has one. Run it on merge to develop / main.
  200 (same content already published) and 201 (published) both succeed;
  409 (different content under an existing version) fails the step.

inputs:
  api-url:
    description: 'Docs API base URL, e.g. https://api.example.com/docs/v1.'
    required: true
  token:
    description: 'Client-credentials access token with the docs:publish scope. Leave empty to fetch one with token-url / client-id / client-secret.'
    required: false
    default: ''
  token-url:
    description: 'OIDC token endpoint for the client-credentials grant (used when token is empty).'
    required: false
    default: ''
  client-id:
    description: 'OIDC client id for the client-credentials grant.'
    required: false
    default: ''
  client-secret:
    description: 'OIDC client secret for the client-credentials grant.'
    required: false
    default: ''
  source-key:
    description: 'Source slug. Defaults to the package.json name without its scope.'
    required: false
    default: ''
  version:
    description: 'Version label. Defaults to the package.json version on main and release branches, else <version>-dev.<short sha>.'
    required: false
    default: ''
  kind:
    description: 'service, library or application.'
    required: false
    default: service
  name:
    description: 'Display name. Defaults to the spec info.title.'
    required: false
    default: ''
  doc-space-key:
    description: 'Platform doc space key, needed on the first publish of a source.'
    required: false
    default: ''
  doc-space-id:
    description: 'Doc space id (instead of doc-space-key).'
    required: false
    default: ''
  spec-path:
    description: 'Path to the spec file, relative to working-directory.'
    required: false
    default: openapi.json
  format:
    description: 'Spec format: openapi or graphql. graphql is implied by graphql / graphql-url.'
    required: false
    default: openapi
  graphql:
    description: 'Path to a GraphQL SDL file (e.g. schema.graphql), relative to working-directory. Publishes format graphql instead of spec-path.'
    required: false
    default: ''
  graphql-url:
    description: 'A GraphQL endpoint to introspect instead of an SDL file. Local environment only (localhost, 127.0.0.1, ::1, *.localhost, host.docker.internal), e.g. a service started earlier in the job.'
    required: false
    default: ''
  graphql-endpoint:
    description: 'Path the GraphQL operations are POSTed to, e.g. /docs/v1/graphql. Defaults to the graphql-url path, else the docs service default /graphql.'
    required: false
    default: ''
  events:
    description: 'Event manifest (topics the service produces and consumes), relative to working-directory. Defaults to docs/events.json when it exists; "none" sends no manifest.'
    required: false
    default: ''
  working-directory:
    description: 'Directory holding package.json and the spec.'
    required: false
    default: '.'
  dry-run:
    description: 'true prints the request and sends nothing.'
    required: false
    default: 'false'

outputs:
  outcome:
    description: 'created, unchanged or dry-run.'
    value: ${{ steps.publish.outputs.outcome }}
  version:
    description: 'The version label that was published.'
    value: ${{ steps.publish.outputs.version }}
  status:
    description: 'HTTP status of the publish call.'
    value: ${{ steps.publish.outputs.status }}

runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOCS_API_URL: ${{ inputs.api-url }}
        DOCS_TOKEN: ${{ inputs.token }}
        DOCS_TOKEN_URL: ${{ inputs.token-url }}
        DOCS_CLIENT_ID: ${{ inputs.client-id }}
        DOCS_CLIENT_SECRET: ${{ inputs.client-secret }}
        DOCS_SOURCE_KEY: ${{ inputs.source-key }}
        DOCS_VERSION: ${{ inputs.version }}
        DOCS_KIND: ${{ inputs.kind }}
        DOCS_NAME: ${{ inputs.name }}
        DOCS_SPACE_KEY: ${{ inputs.doc-space-key }}
        DOCS_SPACE_ID: ${{ inputs.doc-space-id }}
        DOCS_SPEC_PATH: ${{ inputs.spec-path }}
        DOCS_FORMAT: ${{ inputs.format }}
        DOCS_GRAPHQL: ${{ inputs.graphql }}
        DOCS_GRAPHQL_URL: ${{ inputs.graphql-url }}
        DOCS_GRAPHQL_ENDPOINT: ${{ inputs.graphql-endpoint }}
        DOCS_EVENTS: ${{ inputs.events }}
        DOCS_DRY_RUN: ${{ inputs.dry-run }}
      run: '"$GITHUB_ACTION_PATH/publish.sh"'
