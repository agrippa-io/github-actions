name: Run JS Script on Push

on:
  push:
    branches:
      - main # Replace with your target branch name (e.g., 'develop', 'release')

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your desired Node.js version

      - name: Run JavaScript script
        run: node .github/workflows/basic-js.js

      - name: Run JavaScript REST script
        run: node src/actions/action-rest.js
