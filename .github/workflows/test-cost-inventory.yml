name: test-cost-inventory

# Tests for cost/actions/cost-inventory (cost-planner-0 2.4): shellcheck plus
# the script against a local stub planner, then the composite action itself
# so the input → env mapping is exercised.

on:
  pull_request:
    paths: ['cost/**', '.github/workflows/test-cost-inventory.yml', '.github/workflows/cost-inventory.yml']
  push:
    branches: [main]
    paths: ['cost/**', '.github/workflows/test-cost-inventory.yml', '.github/workflows/cost-inventory.yml']
    # The reusable workflow pins the action at an exact tag, so it is tested
    # from the tag itself (job `reusable`), right after the tag is cut.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cost-inventory
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck cost/actions/cost-inventory/trigger.sh cost/actions/cost-inventory/test/run.sh

      - name: Script tests (stub planner)
        run: bash cost/actions/cost-inventory/test/run.sh

      - name: Action, not configured
        id: skipped
        uses: ./cost/actions/cost-inventory

      - name: Action (dry run)
        id: dry
        uses: ./cost/actions/cost-inventory
        with:
          planner-url: http://127.0.0.1:1/cost-planner/v1
          token: dry-run-token
          dry-run: 'true'

      - name: Action, unreachable planner (warning only)
        id: down
        uses: ./cost/actions/cost-inventory
        with:
          planner-url: http://127.0.0.1:1/cost-planner/v1
          token: unreachable-token

      - name: Check outputs
        env:
          SKIPPED: ${{ steps.skipped.outputs.outcome }}
          DRY: ${{ steps.dry.outputs.outcome }}
          DOWN: ${{ steps.down.outputs.outcome }}
        run: |
          [ "$SKIPPED" = skipped ] || { echo "skipped=$SKIPPED"; exit 1; }
          [ "$DRY" = dry-run ] || { echo "dry=$DRY"; exit 1; }
          [ "$DOWN" = failed ] || { echo "down=$DOWN"; exit 1; }

  # The reusable workflow end to end: no vars.COST_PLANNER_URL / secret here,
  # so it skips with a notice. Runs from a tag (or by hand), where its pinned
  # cost-inventory@<tag> exists.
  reusable:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/cost-inventory.yml
    with:
      planner-url: ''

  reusable-check:
    needs: reusable
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - env:
          OUTCOME: ${{ needs.reusable.outputs.outcome }}
        run: '[ "$OUTCOME" = skipped ] || { echo "outcome=$OUTCOME"; exit 1; }'
