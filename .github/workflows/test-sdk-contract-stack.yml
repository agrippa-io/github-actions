name: test-sdk-contract-stack

# Tests for docs/actions/sdk-contract-stack (docs-platform-0 15.6): shellcheck,
# then the action itself from this checkout: the three services come up, the
# specs are ingested, and the fixture can log in and read its organization.

on:
  pull_request:
    paths: ['docs/actions/sdk-contract-stack/**', '.github/workflows/test-sdk-contract-stack.yml']
  push:
    branches: [main]
    paths: ['docs/actions/sdk-contract-stack/**', '.github/workflows/test-sdk-contract-stack.yml']

permissions:
  contents: read

jobs:
  test:
    name: sdk-contract-stack
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck docs/actions/sdk-contract-stack/stack.sh

      - id: stack
        uses: ./docs/actions/sdk-contract-stack
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Smoke
        env:
          ENV_FILE: ${{ steps.stack.outputs.env-file }}
        run: |
          set -euo pipefail
          [ -z "${AGRIPPA_CONTRACT_PASSWORD:-}" ]   # never exported to the job
          set -a
          # shellcheck source=/dev/null
          . "$ENV_FILE"
          set +a
          for url in "$AGRIPPA_CONTRACT_AUTH_URL" "$AGRIPPA_CONTRACT_AUTHZ_URL" "$AGRIPPA_CONTRACT_DOCS_URL"; do
            curl -fsS "$url/health" >/dev/null
          done
          curl -fsS "$AGRIPPA_CONTRACT_DOCS_URL/sources/node-auth-service/versions/$AGRIPPA_CONTRACT_AUTH_VERSION/sdk-model" >/dev/null
          curl -fsS "$AGRIPPA_CONTRACT_DOCS_URL/sources/node-service-authz/versions/$AGRIPPA_CONTRACT_AUTHZ_VERSION/sdk-model" >/dev/null
          body=$(jq -n --arg e "$AGRIPPA_CONTRACT_EMAIL" --arg p "$AGRIPPA_CONTRACT_PASSWORD" '{email:$e,password:$p}')
          curl -fsS -c jar -X POST "$AGRIPPA_CONTRACT_AUTH_URL/auth/login/password" -H 'content-type: application/json' -d "$body" >/dev/null
          key=$(curl -fsS -b jar -H "org-key: $AGRIPPA_CONTRACT_ORG_KEY" "$AGRIPPA_CONTRACT_AUTH_URL/organizations/current" | jq -r .key)
          [ "$key" = "$AGRIPPA_CONTRACT_ORG_KEY" ]

      - if: failure() && steps.stack.outputs.script != ''
        run: ${{ steps.stack.outputs.script }} logs

      - if: always() && steps.stack.outputs.script != ''
        run: ${{ steps.stack.outputs.script }} down
