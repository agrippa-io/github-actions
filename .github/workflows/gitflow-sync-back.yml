name: gitflow-sync-back

# Reusable workflow: after a release lands on the release line (default
# `main`), open a back-merge PR to the integration line (default `develop`)
# so the version bump and any stabilization fixes flow downstream. By default
# the PR is approved and auto-merged once required checks pass — see the
# `auto-merge` input.
#
# Generic gitflow concern — not npm-specific. The `from`/`to` defaults
# match the gitflow convention but can be overridden.

on:
  workflow_call:
    inputs:
      from:
        description: Source branch (just merged production release).
        required: false
        type: string
        default: main
      to:
        description: Target integration branch.
        required: false
        type: string
        default: develop
      version:
        description: 'Version that was just released (used in branch name + PR title for audit traceability). When omitted, the action reads it from `package.json` on `from`.'
        required: false
        type: string
        default: ''
      branch-prefix:
        description: Prefix for the sync branch.
        required: false
        type: string
        default: sync
      auto-merge:
        description: 'Approve the back-merge PR and enable auto-merge so it lands on `to` with no manual step. Needs "Allow auto-merge" enabled in the consumer repo.'
        required: false
        type: boolean
        default: true
    secrets:
      release-token:
        description: 'PAT with `Contents: write` and `Pull requests: write`. Pushes the sync branch, opens the PR (so the target branch CI fires), and enables auto-merge.'
        required: true

jobs:
  sync:
    name: 'Open back-merge PR ${{ inputs.from }} → ${{ inputs.to }}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.release-token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: diff
        name: 'Count commits ${{ inputs.from }} is ahead of ${{ inputs.to }}'
        run: |
          git fetch origin "${{ inputs.to }}:${{ inputs.to }}"
          AHEAD=$(git rev-list --count "${{ inputs.to }}..${{ inputs.from }}")
          echo "${{ inputs.from }} is $AHEAD commits ahead of ${{ inputs.to }}"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

      - id: branch
        if: steps.diff.outputs.ahead != '0'
        name: Create sync branch
        run: |
          # Determine the version label embedded in the sync branch name.
          # Prefer the explicit input; fall back to package.json on the
          # source branch HEAD.
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "unknown")
          fi
          BRANCH="${{ inputs.branch-prefix }}/${{ inputs.from }}-to-${{ inputs.to }}-${VERSION}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Skip silently if a sync branch for this version already exists
          # on origin — an earlier run has the PR in flight.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin — sync PR is in flight."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

      - id: pr
        name: Open back-merge PR
        if: steps.diff.outputs.ahead != '0' && steps.branch.outputs.skip != 'true'
        env:
          # Open with the PAT, not GITHUB_TOKEN: a PR opened by GITHUB_TOKEN
          # does not fire `pull_request`, so the target branch's required
          # checks would never run and auto-merge would wait forever.
          GH_TOKEN: ${{ secrets.release-token }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.branch.outputs.version }}"
          FROM="${{ inputs.from }}"
          TO="${{ inputs.to }}"
          BODY=$(cat <<EOF
          Automatic back-merge of \`$FROM\` into \`$TO\` after publishing
          **v${VERSION}**.

          Per gitflow, every commit on \`$FROM\` must flow back to \`$TO\` so
          the version bump and any release fixes reach the integration branch.
          Approved and set to auto-merge once required checks pass — only act
          if it reports merge conflicts (resolve them on \`$BRANCH\`).
          EOF
          )

          URL=$(gh pr create \
            --base "$TO" \
            --head "$BRANCH" \
            --title "chore(sync): back-merge ${FROM} → ${TO} (v${VERSION})" \
            --body "$BODY")
          echo "Opened $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Approve the back-merge PR
        if: steps.pr.outputs.url != '' && inputs.auto-merge
        env:
          # GITHUB_TOKEN reviews as github-actions[bot] — a different identity
          # from the PAT user that authored the PR, so this is not a
          # self-approval (which GitHub rejects).
          GH_TOKEN: ${{ github.token }}
        run: gh pr review "${{ steps.pr.outputs.url }}" --approve --body "Automated gitflow back-merge."

      - name: Enable auto-merge
        if: steps.pr.outputs.url != '' && inputs.auto-merge
        env:
          GH_TOKEN: ${{ secrets.release-token }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --auto --merge --delete-branch

      - name: No-op summary
        if: steps.diff.outputs.ahead == '0'
        run: echo "${{ inputs.from }} and ${{ inputs.to }} are in sync; nothing to back-merge."
