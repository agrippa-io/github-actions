name: test-publish-docs

# Tests for docs/actions/publish-docs (docs-platform-0 2.7): shellcheck plus
# the script against a local stub API, then the composite action itself in
# dry-run mode so the input → env mapping is exercised.

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/test-publish-docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/test-publish-docs.yml']

permissions:
  contents: read

jobs:
  test:
    name: publish-docs
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck docs/actions/publish-docs/publish.sh docs/actions/publish-docs/test/run.sh

      - name: Script tests (stub API)
        run: bash docs/actions/publish-docs/test/run.sh

      - name: Fixture
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          echo '{"name":"@agrippa-io/node-demo","version":"1.2.3"}' > "$RUNNER_TEMP/demo/package.json"
          echo '{"openapi":"3.1.0","info":{"title":"Demo","version":"1.2.3"},"paths":{}}' > "$RUNNER_TEMP/demo/openapi.json"

      - name: Action (dry run)
        id: dry
        uses: ./docs/actions/publish-docs
        with:
          api-url: http://127.0.0.1:1/docs/v1
          working-directory: ${{ runner.temp }}/demo
          doc-space-key: platform
          dry-run: 'true'

      - name: Check outputs
        env:
          OUTCOME: ${{ steps.dry.outputs.outcome }}
          VERSION: ${{ steps.dry.outputs.version }}
        run: |
          [ "$OUTCOME" = dry-run ] || { echo "outcome=$OUTCOME"; exit 1; }
          case "$VERSION" in 1.2.3|1.2.3-dev.*) ;; *) echo "version=$VERSION"; exit 1 ;; esac
