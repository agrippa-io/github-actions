name: npm-publish-prerelease

# Reusable workflow: publish a prerelease build to npm under a configurable
# dist-tag.
#
# Designed for the canary / dev / staging publish patterns:
#   canary  → dist-tag canary,  suffix `canary.<short-sha>`           (on PR)
#   dev     → dist-tag dev,     suffix `dev.<pr-number>.<short-sha>`  (on develop push)
#   staging → dist-tag staging, suffix `rc.<run-number>`              (on release/* push)
#
# The version suffix is caller-supplied so this single workflow handles all
# three patterns. For dev publishes, the caller is responsible for looking
# up the PR number / merge SHA in a small pre-job and threading the result
# into `version-suffix`.

on:
  workflow_call:
    inputs:
      npm-scope:
        description: Private npm scope (e.g. `@agrippa-io`).
        required: true
        type: string
      node-version-file:
        description: Path to the file holding the Node version.
        required: false
        type: string
        default: .nvmrc
      registry-url:
        description: npm registry URL for the scope.
        required: false
        type: string
        default: https://registry.npmjs.org
      dist-tag:
        description: 'npm dist-tag (e.g. `canary`, `dev`, `staging`).'
        required: true
        type: string
      version-suffix:
        description: 'Suffix appended after `-` to the base version. Example: `canary.abc1234`, `dev.42.abc1234`, `rc.17`.'
        required: true
        type: string
      access:
        description: 'Passed to `npm publish --access`. Use `restricted` for private scope, `public` for public.'
        required: false
        type: string
        default: restricted
      mode:
        description: >-
          `publish` runs `npm publish` (the token must be allowed to publish
          directly; granular tokens lose that in January 2027). `stage` runs
          `npm stage publish`: the version waits on npm until a maintainer
          approves it with 2FA (`npm stage approve <id>` or npmjs.com → Staged
          Packages). Staging works with a "Read and write (stage only)" token.
        required: false
        type: string
        default: publish
      npm-version:
        description: 'npm CLI installed before staging (`npm stage` needs >= 11.15.0; Node 24 bundles 11.12).'
        required: false
        type: string
        default: '^11.15.0'
      ref:
        description: 'Optional explicit ref to check out (e.g. the PR head SHA for canary publishes). Defaults to the workflow''s triggering ref.'
        required: false
        type: string
        default: ''
    secrets:
      npm-token:
        description: NPM auth token used for install + publish.
        required: true
    outputs:
      version:
        description: Full prerelease version that was published.
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    name: Publish ${{ inputs.dist-tag }} to npm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: agrippa-io/github-actions/npm/actions/setup-node-project@v1
        with:
          npm-scope: ${{ inputs.npm-scope }}
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}
          npm-token: ${{ secrets.npm-token }}

      - id: version
        uses: agrippa-io/github-actions/npm/actions/compute-prerelease-version@v1
        with:
          suffix: ${{ inputs.version-suffix }}

      - name: Check mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            publish|stage) ;;
            *) echo "::error::mode must be 'publish' or 'stage' (got '$MODE')"; exit 1 ;;
          esac

      - name: 'Publish to npm (dist-tag: ${{ inputs.dist-tag }})'
        if: inputs.mode == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: npm publish --tag ${{ inputs.dist-tag }} --access ${{ inputs.access }}

      - name: Install an npm CLI with `npm stage`
        if: inputs.mode == 'stage'
        shell: bash
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@$NPM_VERSION" && npm --version

      - name: 'Stage on npm (dist-tag: ${{ inputs.dist-tag }})'
        if: inputs.mode == 'stage'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          TAG: ${{ inputs.dist-tag }}
          ACCESS: ${{ inputs.access }}
        run: |
          set -euo pipefail
          npm stage publish --tag "$TAG" --access "$ACCESS"
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### Staged \`$NAME@$VERSION\` (dist-tag \`$TAG\`)"
            echo
            echo "Not installable until a maintainer approves it with 2FA:"
            echo
            echo '```bash'
            echo "npm stage list $NAME          # find the stage id"
            echo "npm stage approve <stage-id>  # publishes it"
            echo '```'
            echo
            echo "Or npmjs.com → Staged Packages. \`npm stage reject <stage-id>\` discards it."
          } >> "$GITHUB_STEP_SUMMARY"
